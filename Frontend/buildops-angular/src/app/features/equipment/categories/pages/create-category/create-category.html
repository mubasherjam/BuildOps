<div class="category-container">

  <h1>{{ pageTitle }}</h1>

  <p>Add a new equipment category to BuildOps.</p>

  <div class="form-group">

    <label for="categoryName">
      Category Name *
    </label>

    <input
      id="categoryName"
      type="text"
      [(ngModel)]="categoryName"
      [disabled]="isLoading()"
      placeholder="Enter category name"
      maxlength="100"
    />

  </div>

  <div class="form-group">

    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      [(ngModel)]="description"
      [disabled]="isLoading()"
      placeholder="Enter description"
      maxlength="500"
      rows="4"
    ></textarea>

  </div>

  <div class="actions">

    <button
      class="reset-button"
      [disabled]="isLoading()"
      (click)="resetForm()">
      Reset
    </button>

    <button
      class="create-button"
      [disabled]="isLoading() || !categoryName.trim()"
      (click)="createCategory()">

      {{ isLoading() ? 'Creating...' : 'Create Category' }}

    </button>

  </div>

  @if (successMessage()) {
    <div class="success-message" role="status">
      {{ successMessage() }}
    </div>
  }

  @if (errorMessage()) {
    <div class="error-message" role="alert">
      {{ errorMessage() }}
    </div>
  }
<a
  class="back-link"
  routerLink="/equipment/categories">
  ← Back to Categories
</a>
</div>
